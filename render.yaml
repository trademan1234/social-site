services:
  - type: web
    name: pulse
    runtime: node
    plan: free
    buildCommand: npm --prefix server ci && npm --prefix client ci --include=dev && npm --prefix client run build
    startCommand: npm --prefix server start
    healthCheckPath: /api/posts
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: NODE_ENV
        value: production
      - key: MONGOMS_DISABLE_POSTINSTALL
        value: "1"
      - key: MONGO_URI
        sync: false
      - key: GDRIVE_CLIENT_ID
        sync: false
      - key: GDRIVE_CLIENT_SECRET
        sync: false
      - key: GDRIVE_REFRESH_TOKEN
        sync: false
